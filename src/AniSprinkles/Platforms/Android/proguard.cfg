# R8 keep rules for Release builds.
#
# .NET calls bound Java libraries through JNI, by method name. R8 cannot see those calls, so a
# Java method that only .NET uses looks dead and is removed, and the call fails at runtime with
# NoSuchMethodError / IncompatibleClassChangeError. Debug builds never run R8, so this only ever
# shows up in Release.
#
# UseMaterial3 (#172) makes MAUI draw its controls with Material Components (SliderHandler2 uses
# com.google.android.material.slider.Slider). v0.16.0 shipped with BaseSlider.addOnChangeListener
# stripped, and every details page failed to render. Keep all of Material rather than chase it
# one control at a time.
-keep class com.google.android.material.** { *; }
