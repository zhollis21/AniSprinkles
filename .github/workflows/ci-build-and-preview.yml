# CI workflow: Builds the app, runs unit tests, and captures UI screenshots
# Triggers on pull request creation/update targeting main
# Screenshots are committed to the screenshots/ folder on the branch and
# embedded in PR comments using commit-SHA-based URLs for reliable rendering
#
# Auth note: The CI build uses compile-time stub services (CIAuthService, CIAniListClient)
# activated by -p:CiBuild=true. These stubs make the app appear fully authenticated
# with hardcoded data, so screenshots show the real UI without any OAuth token or
# GitHub secret. No ANILIST_CI_TOKEN secret is needed.
name: CI Build & UI Preview

on:
  pull_request:
    branches: [main]
    # This workflow costs a full MAUI build plus an emulator boot (~20-30 min), so
    # skip it for changes that cannot affect the app. GitHub skips the run only when
    # EVERY changed file matches one of these, so a PR touching both docs and src/
    # still builds.
    #
    # Deliberately NOT ignored: .github/** (workflow edits should be validated by
    # running) and .editorconfig (it carries analyzer rules, and the build must stay
    # at zero warnings).
    paths-ignore:
      - ".claude/**"
      - "**/*.md"
      - "StoreImages/**"
      - "screenshots/**"
      - ".gitignore"
      - ".gitattributes"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet Packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('AniSprinkles.slnx', 'src/**/*.csproj', 'tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore Dependencies
        run: dotnet restore AniSprinkles.slnx

      - name: Build
        run: |
          dotnet build src/AniSprinkles/AniSprinkles.csproj \
            -c Debug \
            -f net10.0-android \
            -p:EmbedAssembliesIntoApk=true \
            -p:CiBuild=true \
            --no-restore

      - name: Run Tests
        run: |
          # A skipped test is a test that stopped checking, and the summary table alone never caught
          # one: #117's glyph suite skips gracefully when it cannot locate the icon package, so when
          # #62 moved the app csproj out from under that lookup, all 190 cases turned into skips and
          # the job still reported green. Both numbers below are gates, not decoration.
          #
          #   MAX_SKIPPED_TESTS - raise it, with a comment saying why, only for a skip that is
          #     genuinely environment-dependent and that CI cannot satisfy.
          #   MIN_TOTAL_TESTS   - a floor on the summed total, so tests that VANISH are caught as
          #     well as tests that skip. The same incident also dropped the total by 231, and a
          #     stale-assembly run reported 557 against a 644-test suite; neither shows up as a skip.
          #     Ratchet it up as the suite grows. Lowering it needs a reason.
          MAX_SKIPPED_TESTS=0
          MIN_TOTAL_TESTS=830

          # The parsed counts are strings and can be the literal "?" (see the new-runner branch
          # below), so everything numeric is guarded through here before a -gt / -lt comparison.
          is_count() { case "$1" in '' | *[!0-9]*) return 1 ;; *) return 0 ;; esac; }

          # Auto-detect test projects so future additions are picked up
          TEST_PROJECTS=$(find . -name "*.csproj" \( -path "*/tests/*" -o -path "*/test/*" -o -name "*Test*.csproj" -o -name "*Tests*.csproj" \) | grep -v node_modules || true)
          if [ -n "$TEST_PROJECTS" ]; then
            echo "Found test projects:"
            echo "$TEST_PROJECTS"

            {
              echo "## 🧪 Unit Tests"
              echo ""
              echo "| Project | Result | Passed | Failed | Skipped | Duration |"
              echo "| --- | :---: | ---: | ---: | ---: | ---: |"
            } >> "$GITHUB_STEP_SUMMARY"

            OVERALL_EXIT=0
            TOTAL_ALL=0
            TOTAL_SEEN=0
            for proj in $TEST_PROJECTS; do
              PROJ_NAME=$(basename "$proj" .csproj)
              set +e
              OUTPUT=$(dotnet test "$proj" --no-restore --verbosity normal 2>&1)
              PROJ_EXIT=$?
              set -e
              echo "$OUTPUT"

              # Support both output formats:
              #   New runner:  "Passed!  - Failed: 0, Passed: 25, ..., Duration: 200 ms" (or "Duration: 2 s" on slower runs)
              #   VSTest/CI:   "Test Run Successful.\nTotal tests: 25\n     Passed: 25\n Total time: 0.71 Seconds"
              NEW_LINE=$(echo "$OUTPUT" | grep -E "^(Passed|Failed)!  - " | tail -1)
              VSTEST_LINE=$(echo "$OUTPUT" | grep -E "^Test Run (Successful|Failed)\." | tail -1)

              if [ -n "$NEW_LINE" ]; then
                P=$(echo "$NEW_LINE" | grep -oP 'Passed:\s*\K\d+' | head -1);  P="${P:-?}"
                F=$(echo "$NEW_LINE" | grep -oP 'Failed:\s*\K\d+' | head -1);  F="${F:-?}"
                S=$(echo "$NEW_LINE" | grep -oP 'Skipped:\s*\K\d+' | head -1); S="${S:-?}"
                T=$(echo "$NEW_LINE" | grep -oP 'Total:\s*\K\d+' | head -1);   T="${T:-?}"
                D=$(echo "$NEW_LINE" | grep -oP 'Duration:\s*\K[\d.]+ m?s' | head -1); D="${D:-?}"
                PARSED=1
              elif [ -n "$VSTEST_LINE" ]; then
                P=$(echo "$OUTPUT" | grep -oP '^\s+Passed:\s*\K\d+'  | head -1); P="${P:-0}"
                F=$(echo "$OUTPUT" | grep -oP '^\s+Failed:\s*\K\d+'  | head -1); F="${F:-0}"
                S=$(echo "$OUTPUT" | grep -oP '^\s+Skipped:\s*\K\d+' | head -1); S="${S:-0}"
                T=$(echo "$OUTPUT" | grep -oP 'Total tests:\s*\K\d+' | head -1); T="${T:-0}"
                D_RAW=$(echo "$OUTPUT" | grep -oP 'Total time:\s*\K[\d.]+' | head -1)
                D="${D_RAW:+${D_RAW}s}"; D="${D:-?}"
                PARSED=1
              else
                PARSED=0
              fi

              # Pass/fail is keyed off the test runner's exit code, not our ability to parse
              # its output — a runner output format change should never fail CI on its own.
              if [ "$PROJ_EXIT" -eq 0 ]; then ICON="✅"; else ICON="❌"; OVERALL_EXIT=1; fi

              # The counts are only ever acted on when the output parsed, which keeps that rule
              # intact. S can be the literal "?" while PARSED is still 1 — the new-runner branch
              # defaults it that way — so it goes through is_count rather than a bare -gt.
              if [ "$PARSED" -eq 1 ] && is_count "$S" && [ "$S" -gt "$MAX_SKIPPED_TESTS" ]; then
                echo "::error::$PROJ_NAME skipped $S test(s); the allowed maximum is $MAX_SKIPPED_TESTS. A skipped test is a test that stopped checking — fix it, or raise MAX_SKIPPED_TESTS in ci-build-and-preview.yml with a comment saying why."
                ICON="❌"
                OVERALL_EXIT=1
              fi

              if [ "$PARSED" -eq 1 ] && is_count "$T"; then
                TOTAL_ALL=$((TOTAL_ALL + T))
                TOTAL_SEEN=1
              fi

              if [ "$PARSED" -eq 1 ]; then
                echo "| \`$PROJ_NAME\` | $ICON | $P | $F | $S | $D |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| \`$PROJ_NAME\` | $ICON | ? | ? | ? | ? |" >> "$GITHUB_STEP_SUMMARY"
              fi
            done

            # A suite that shrinks is as invisible as one that skips. Gated on at least one project
            # having parsed, so unparseable output still cannot fail the job on its own.
            if [ "$TOTAL_SEEN" -eq 1 ] && [ "$TOTAL_ALL" -lt "$MIN_TOTAL_TESTS" ]; then
              echo "::error::Only $TOTAL_ALL test(s) ran across all projects; the floor is $MIN_TOTAL_TESTS. Tests were removed or did not run — rule out a stale assembly before lowering MIN_TOTAL_TESTS in ci-build-and-preview.yml."
              OVERALL_EXIT=1
            fi

            {
              echo ""
              if [ "$TOTAL_SEEN" -eq 1 ]; then
                echo "_$TOTAL_ALL tests total (floor $MIN_TOTAL_TESTS) · $MAX_SKIPPED_TESTS skips allowed._"
              else
                echo "_Counts could not be parsed; the result above is the runner's exit code only._"
              fi
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit $OVERALL_EXIT
          else
            echo "::notice::No test projects found. Tests will run automatically when added."
            {
              echo "## 🧪 Unit Tests"
              echo ""
              echo "> ℹ️ No test projects found."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: src/AniSprinkles/bin/Debug/net10.0-android/*-Signed.apk
          retention-days: 5
          if-no-files-found: error

      - name: Generate Build Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:** Debug" >> $GITHUB_STEP_SUMMARY
          echo "**Framework:** net10.0-android" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  ui-screenshots:
    name: UI Screenshots
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    # Screenshots are informational — emulator flakiness should not block the CI gate
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: /tmp/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator-runner action executes each script line as a separate
      # `sh -c` invocation, which breaks multi-line constructs (if/fi, for/done).
      # Work around this by writing the full script to a temp file first.
      - name: Create Screenshot Script
        run: |
          cat > /tmp/capture_screenshots.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          # Shared helper: find a UI node by attribute value, parse its bounds, and tap it.
          # Usage: _tap_by_attribute "text" "ONE PIECE"
          #        _tap_by_attribute "content-desc" "Toggle favorite"
          _tap_by_attribute() {
            local attr="$1" value="$2"
            # Remove any previous dump so a failed dump cannot leave us parsing stale UI.
            adb shell rm -f /sdcard/ui_tap.xml >/dev/null 2>&1 || true
            if ! adb shell uiautomator dump /sdcard/ui_tap.xml >/dev/null 2>&1; then
              echo "::warning::Failed to dump current UI hierarchy"
              return 1
            fi
            if ! adb shell test -s /sdcard/ui_tap.xml >/dev/null 2>&1; then
              echo "::warning::UI hierarchy dump was not written"
              return 1
            fi
            local bounds value_re
            # The node grep below is a regex, but callers pass UI text that can contain
            # regex metacharacters (e.g. the "." in "Monkey D. Luffy"), which would match
            # unintended nodes. Escape everything but alphanumerics/spaces so the value is
            # matched literally; the bounds extraction stays a fixed regex.
            value_re=$(printf '%s' "$value" | sed 's/[^a-zA-Z0-9 ]/\\&/g')
            # `|| true` suppresses pipefail when grep finds no match (exits 1),
            # leaving $bounds empty — handled by the guard below.
            bounds=$(adb shell cat /sdcard/ui_tap.xml 2>/dev/null \
              | grep -o "${attr}=\"${value_re}\"[^>]*" \
              | grep -o 'bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' \
              | head -1 \
              | sed 's/bounds="//;s/"//') || true
            if [ -z "$bounds" ]; then
              echo "::warning::Could not find element with ${attr}='${value}'"
              return 1
            fi
            local left top right bottom cx cy
            left=$(echo "$bounds" | sed 's/\[//g;s/\]/ /g' | awk -F'[, ]' '{print $1}')
            top=$(echo "$bounds" | sed 's/\[//g;s/\]/ /g' | awk -F'[, ]' '{print $2}')
            right=$(echo "$bounds" | sed 's/\[//g;s/\]/ /g' | awk -F'[, ]' '{print $3}')
            bottom=$(echo "$bounds" | sed 's/\[//g;s/\]/ /g' | awk -F'[, ]' '{print $4}')
            cx=$(( (left + right) / 2 ))
            cy=$(( (top + bottom) / 2 ))
            echo "Tapping ${attr}='${value}' at (${cx}, ${cy}) — bounds: ${bounds}"
            adb shell input tap "$cx" "$cy"
          }

          # Tap a UI element by its visible text label.
          # Usage: tap_element_by_text "Settings"
          tap_element_by_text()         { _tap_by_attribute "text"         "$1"; }

          # Tap a UI element by its content-desc attribute (for icon buttons with no label).
          # Usage: tap_element_by_content_desc "Toggle favorite"
          tap_element_by_content_desc() { _tap_by_attribute "content-desc" "$1"; }

          # Scroll until a target studio chip is visible, then tap it. Prefer the
          # semantic description because it is tied to the tappable chip container;
          # fall back to visible text for platform differences.
          # Usage: tap_studio_chip "Toei Animation" [max_swipes]
          tap_studio_chip() {
            local studio="$1" max="${2:-6}" i
            for i in $(seq 1 "$max"); do
              adb shell rm -f /sdcard/ui_studio_chip.xml >/dev/null 2>&1 || true
              if adb shell uiautomator dump /sdcard/ui_studio_chip.xml >/dev/null 2>&1 \
                 && adb shell test -s /sdcard/ui_studio_chip.xml >/dev/null 2>&1; then
                local ui_dump
                ui_dump=$(adb shell cat /sdcard/ui_studio_chip.xml 2>/dev/null || echo "")
                if echo "$ui_dump" | grep -qF "content-desc=\"Open studio ${studio}\""; then
                  tap_element_by_content_desc "Open studio ${studio}"
                  return $?
                fi
                if echo "$ui_dump" | grep -qF "text=\"${studio}\""; then
                  tap_element_by_text "$studio"
                  return $?
                fi
              fi
              adb shell input swipe 720 2200 720 800 300
              sleep 1
            done
            echo "::warning::Could not find studio chip '${studio}' after ${max} swipe(s)"
            return 1
          }

          # Swipe up (scroll the page down) until an element with the given visible text is on
          # screen, so off-screen sections (character/voice-actor lists below the fold) can be
          # revealed and then tapped. Returns success as soon as the text is found.
          # Usage: scroll_until_text "Monkey D. Luffy" [max_swipes]
          scroll_until_text() {
            local needle="$1" max="${2:-10}" i
            for i in $(seq 1 "$max"); do
              adb shell rm -f /sdcard/ui_scroll.xml >/dev/null 2>&1 || true
              if adb shell uiautomator dump /sdcard/ui_scroll.xml >/dev/null 2>&1 \
                 && adb shell cat /sdcard/ui_scroll.xml 2>/dev/null | grep -qF "text=\"${needle}\""; then
                echo "Found '${needle}' after $((i - 1)) swipe(s)"
                return 0
              fi
              # Pixel 7 Pro is 1440x3120; swipe within the content area, leaving the toolbar alone.
              adb shell input swipe 720 2200 720 800 300
              sleep 1
            done
            echo "::warning::'${needle}' not found after ${max} swipe(s)"
            return 1
          }

          # Search is its own tab now (issue #43), with an always-visible search bar. The old
          # helper here mirrored the hamburger's x across the screen width to find Discover's
          # toolbar search icon, because MAUI toolbar icons expose no uiautomator node; the
          # bottom tab bar removed both the hamburger anchor and the need for the trick.
          # Usage: open_search_tab
          open_search_tab() {
            goto_tab "Search"
          }

          # Tap the first "View All ›" row link. Its text node carries the chevron (a multibyte
          # char), so match on the "View All" prefix up to the next quote rather than exact text.
          # Usage: tap_first_view_all
          tap_first_view_all() {
            adb shell rm -f /sdcard/ui_viewall.xml >/dev/null 2>&1 || true
            if ! adb shell uiautomator dump /sdcard/ui_viewall.xml >/dev/null 2>&1 \
               || ! adb shell test -s /sdcard/ui_viewall.xml >/dev/null 2>&1; then
              echo "::warning::Failed to dump UI for View All"
              return 1
            fi
            local bounds
            bounds=$(adb shell cat /sdcard/ui_viewall.xml 2>/dev/null \
              | tr '>' '>\n' \
              | grep -o 'text="View All[^"]*"[^/]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' \
              | grep -o 'bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' \
              | head -1 | sed 's/bounds="//;s/"//') || true
            if [ -z "$bounds" ]; then
              echo "::warning::Could not find a 'View All' link"
              return 1
            fi
            local l t r bot cx cy
            l=$(echo "$bounds" | sed 's/\[//g;s/\]/ /g' | awk -F'[, ]' '{print $1}')
            t=$(echo "$bounds" | sed 's/\[//g;s/\]/ /g' | awk -F'[, ]' '{print $2}')
            r=$(echo "$bounds" | sed 's/\[//g;s/\]/ /g' | awk -F'[, ]' '{print $3}')
            bot=$(echo "$bounds" | sed 's/\[//g;s/\]/ /g' | awk -F'[, ]' '{print $4}')
            cx=$(( (l + r) / 2 )); cy=$(( (t + bot) / 2 ))
            echo "Tapping 'View All' at (${cx}, ${cy})"
            adb shell input tap "$cx" "$cy"
          }

          # Switch bottom tabs by tapping the tab's label (issue #43). Tab labels are real
          # uiautomator nodes carrying both text and content-desc, so this is an ordinary text
          # tap that works from anywhere — including partway down a pushed details stack, which
          # is why it replaced the old back-out-then-open-the-drawer dance entirely.
          # Returns non-zero when the tab label was not found, so callers can skip the
          # screenshots that depend on having arrived (the trailing sleep must not mask it).
          # Usage: goto_tab "Discover"
          goto_tab() {
            tap_element_by_text "$1" || return 1
            sleep 2
          }

          # Locate the APK
          APK_PATH=$(find /tmp/apk -name "*-Signed.apk" -type f | head -1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No signed APK found in artifacts"
            exit 1
          fi
          echo "Installing APK: $APK_PATH"

          # Install or replace the app on the emulator. `-r` handles reused AVDs
          # and `-d` allows reinstall if a newer debug build is already present.
          adb install -r -d "$APK_PATH"

          # Verify the package actually installed before trying to launch it.
          PACKAGE="com.RainbowSprinkles.AniSprinkles"
          if ! adb shell pm list packages | grep -qF "$PACKAGE"; then
            echo "::error::Package $PACKAGE not found after install — aborting"
            exit 1
          fi

          # Dismiss the lock screen before launching so it doesn't appear in screenshots.
          adb shell wm dismiss-keyguard

          # Resolve the launcher activity dynamically so this survives any future
          # MAUI namespace or assembly renames (which change the crc64 class name).
          MAIN_ACTIVITY=$(adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER "$PACKAGE" | tail -1 || true)
          if [ -z "$MAIN_ACTIVITY" ] || echo "$MAIN_ACTIVITY" | grep -qi "error\|no activity"; then
            echo "::error::Could not resolve launcher activity for $PACKAGE — got: '$MAIN_ACTIVITY'"
            exit 1
          fi
          echo "Launching: $MAIN_ACTIVITY"

          # -W: wait until onResume before returning (eliminates window-detection race)
          # -S: force-stop any stale process first
          adb shell am start -W -S -n "$MAIN_ACTIVITY"
          AUTH_MODE="ci-stubs"

          # Poll for app window to appear (up to 30s).
          # -W in am start blocks until onResume, so the window should already be
          # visible, but we poll as a safety net for slow emulator rendering.
          echo "Waiting for app to start..."
          WINDOW_FOUND=0
          for i in $(seq 1 30); do
            if adb shell dumpsys window windows 2>/dev/null | grep -qF "$PACKAGE"; then
              echo "App window detected after ${i}s"
              WINDOW_FOUND=1
              break
            fi
            sleep 1
          done

          if [ "$WINDOW_FOUND" -ne 1 ]; then
            echo "::error::App window for package $PACKAGE was not detected within 30 seconds; aborting to avoid misleading UI screenshots."
            exit 1
          fi

          # Wait for the page to finish loading by polling the UI hierarchy.
          # The app shows "Checking authentication" then "Loading anime list" text
          # while data is being fetched. We poll until those indicators disappear,
          # with a hard cap to avoid hanging forever.
          MAX_WAIT=60
          MIN_WAIT=5
          POLL_INTERVAL=3
          echo "Waiting for page to finish loading (up to ${MAX_WAIT}s)..."
          sleep $MIN_WAIT
          ELAPSED=$MIN_WAIT
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Dump UI hierarchy to check for loading indicators
            adb shell uiautomator dump /sdcard/ui_dump.xml 2>/dev/null || true
            UI_DUMP=$(adb shell cat /sdcard/ui_dump.xml 2>/dev/null || echo "")
            if echo "$UI_DUMP" | grep -qi "Checking authentication"; then
              echo "  Still checking authentication... (${ELAPSED}s)"
            elif echo "$UI_DUMP" | grep -qi "Loading anime list"; then
              echo "  Still loading anime list... (${ELAPSED}s)"
            else
              echo "  Page appears ready after ${ELAPSED}s"
              break
            fi
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "::warning::Timed out waiting for page to load after ${MAX_WAIT}s — capturing anyway"
          fi

          # Start from empty. The checkout carries the PREVIOUS run's screenshots (they are
          # committed to the branch), so without this any capture that fails silently leaves last
          # run's PNG on disk — and the publish step then commits and embeds it as if it were
          # current. A missing screenshot is obvious; a stale one that looks plausible is not.
          rm -rf screenshots
          mkdir -p screenshots

          # Screenshot 1: Library tab, Anime sub-tab (the app's launch destination)
          adb shell screencap -p /sdcard/my_anime.png || echo "::warning::Failed to capture Library screenshot"
          adb pull /sdcard/my_anime.png screenshots/my_anime.png || echo "::warning::Failed to pull Library screenshot"
          echo "Captured: my_anime.png (Library — $AUTH_MODE)"

          # Tap One Piece to open its details page
          tap_element_by_text "ONE PIECE" || echo "::warning::Could not find ONE PIECE in list"

          # Poll for the details page to load (up to 15s)
          DETAILS_WAIT=0
          while [ $DETAILS_WAIT -lt 15 ]; do
            adb shell uiautomator dump /sdcard/ui_details.xml 2>/dev/null || true
            if adb shell cat /sdcard/ui_details.xml 2>/dev/null | grep -qi "Episode"; then
              echo "  Details page ready after ${DETAILS_WAIT}s"
              sleep 1
              break
            fi
            sleep 1
            DETAILS_WAIT=$((DETAILS_WAIT + 1))
          done

          # Screenshot 2: One Piece details page
          adb shell screencap -p /sdcard/one_piece_details.png || echo "::warning::Failed to capture details screenshot"
          adb pull /sdcard/one_piece_details.png screenshots/one_piece_details.png || echo "::warning::Failed to pull details screenshot"
          echo "Captured: one_piece_details.png (One Piece Details — $AUTH_MODE)"

          # Screenshot 3: Studio details (Toei Animation). Tap the studio chip in the One Piece
          # quick-info row, capture the Studio Details page, then return to One Piece details.
          if tap_studio_chip "Toei Animation" 6; then
            STUDIO_WAIT=0
            STUDIO_READY=0
            while [ $STUDIO_WAIT -lt 15 ]; do
              adb shell uiautomator dump /sdcard/ui_studio.xml 2>/dev/null || true
              if adb shell cat /sdcard/ui_studio.xml 2>/dev/null | grep -qi "Productions"; then
                echo "  Studio page ready after ${STUDIO_WAIT}s"
                STUDIO_READY=1
                break
              fi
              sleep 1
              STUDIO_WAIT=$((STUDIO_WAIT + 1))
            done

            if [ "$STUDIO_READY" -eq 1 ]; then
              sleep 1
              adb shell screencap -p /sdcard/studio_details.png || echo "::warning::Failed to capture studio screenshot"
              adb pull /sdcard/studio_details.png screenshots/studio_details.png || echo "::warning::Failed to pull studio screenshot"
              echo "Captured: studio_details.png (Toei Animation — $AUTH_MODE)"
            else
              echo "::warning::Studio details page did not finish loading — skipping studio screenshot"
            fi

            adb shell input keyevent KEYCODE_BACK
            sleep 1.5
          else
            echo "::warning::Could not tap Toei Animation studio chip — skipping studio screenshot"
          fi

          # Screenshot 4: Character details (Monkey D. Luffy). Scroll the One Piece details page
          # down to the Characters section and tap Luffy, then capture his page at the TOP so the
          # hero (portrait, name, stat cards) represents the page.
          scroll_until_text "Monkey D. Luffy" && tap_element_by_text "Monkey D. Luffy" || echo "::warning::Could not reach Luffy from the details page"

          CHAR_WAIT=0
          while [ $CHAR_WAIT -lt 15 ]; do
            adb shell uiautomator dump /sdcard/ui_char.xml 2>/dev/null || true
            if adb shell cat /sdcard/ui_char.xml 2>/dev/null | grep -qi "Voice Actors\|Appears In"; then
              echo "  Character page ready after ${CHAR_WAIT}s"
              break
            fi
            sleep 1
            CHAR_WAIT=$((CHAR_WAIT + 1))
          done
          # Slightly longer settle: the hero portrait is a large remote image captured early in
          # the page's life, so give Glide a moment to paint it before the screenshot.
          sleep 2
          adb shell screencap -p /sdcard/character_details.png || echo "::warning::Failed to capture character screenshot"
          adb pull /sdcard/character_details.png screenshots/character_details.png || echo "::warning::Failed to pull character screenshot"
          echo "Captured: character_details.png (Luffy — $AUTH_MODE)"
          # Now scroll the voice-actor strip into view to locate the staff-page tap target below.
          scroll_until_text "Mayumi Tanaka" || echo "::warning::Voice Actors list did not appear"

          # Screenshot 5: Staff details (Mayumi Tanaka) — tap her in the now-visible Voice Actors
          # list, then capture at the TOP so the hero represents the page.
          tap_element_by_text "Mayumi Tanaka" || echo "::warning::Could not tap Mayumi Tanaka"

          STAFF_WAIT=0
          while [ $STAFF_WAIT -lt 15 ]; do
            adb shell uiautomator dump /sdcard/ui_staff.xml 2>/dev/null || true
            if adb shell cat /sdcard/ui_staff.xml 2>/dev/null | grep -qi "Voice Roles\|Production"; then
              echo "  Staff page ready after ${STAFF_WAIT}s"
              break
            fi
            sleep 1
            STAFF_WAIT=$((STAFF_WAIT + 1))
          done
          # Slightly longer settle so the hero portrait paints before capture (see above).
          sleep 2
          adb shell screencap -p /sdcard/staff_details.png || echo "::warning::Failed to capture staff screenshot"
          adb pull /sdcard/staff_details.png screenshots/staff_details.png || echo "::warning::Failed to pull staff screenshot"
          echo "Captured: staff_details.png (Mayumi Tanaka — $AUTH_MODE)"

          # Straight to the Settings tab. The details stack this leaves behind on the Library tab
          # does not matter — the next section taps its own tab too. Guarded because `set -e`
          # would otherwise abort the whole run (and lose every later screenshot) on one miss.
          # Gated like the Discover capture below: on a missed tab we are still sitting on the
          # staff details page, and capturing anyway would file THAT as settings.png. Skipping
          # leaves the screenshot absent, which is visible; publishing the wrong page is not.
          if goto_tab "Settings"; then
            # Poll for Settings page to finish loading (up to 15s)
            # "Display Preferences" is a static label always visible once loaded.
            SETTINGS_LOAD_WAIT=0
            while [ $SETTINGS_LOAD_WAIT -lt 15 ]; do
              adb shell uiautomator dump /sdcard/ui_settings_loaded.xml 2>/dev/null || true
              SETTINGS_DUMP=$(adb shell cat /sdcard/ui_settings_loaded.xml 2>/dev/null || echo "")
              if echo "$SETTINGS_DUMP" | grep -q "Loading settings"; then
                echo "  Still loading settings... (${SETTINGS_LOAD_WAIT}s)"
              elif echo "$SETTINGS_DUMP" | grep -q "Display Preferences"; then
                echo "  Settings loaded after ${SETTINGS_LOAD_WAIT}s"
                sleep 1
                break
              fi
              sleep 1
              SETTINGS_LOAD_WAIT=$((SETTINGS_LOAD_WAIT + 1))
            done
            if [ $SETTINGS_LOAD_WAIT -ge 15 ]; then
              echo "::warning::Settings page did not finish loading — capturing anyway"
            fi

            # Screenshot 6: Settings page
            adb shell screencap -p /sdcard/settings.png || echo "::warning::Failed to capture Settings screenshot"
            adb pull /sdcard/settings.png screenshots/settings.png || echo "::warning::Failed to pull Settings screenshot"
            echo "Captured: settings.png (Settings — $AUTH_MODE)"
          else
            echo "::warning::Could not reach the Settings tab — skipping Settings screenshot"
          fi

          # ---- Discover / View All / Search (issues #15/#16) ----
          # All rendered from CI stub fixtures (popular SFW titles); the adult toggle defaults off,
          # so the 18+ rows are never requested.

          # Straight to the Discover tab. Kept behind DISCOVER_OPENED so a failure to reach the
          # tab skips the dependent screenshots rather than capturing whatever was on screen.
          DISCOVER_OPENED=0
          if goto_tab "Discover"; then
            DISCOVER_OPENED=1
          else
            echo "::warning::Could not reach the Discover tab — skipping its screenshots"
          fi

          if [ "$DISCOVER_OPENED" -eq 1 ]; then
            # Wait for the rows to populate (a known section header appears once loaded).
            DISC_WAIT=0
            while [ $DISC_WAIT -lt 20 ]; do
              adb shell uiautomator dump /sdcard/ui_disc.xml 2>/dev/null || true
              if adb shell cat /sdcard/ui_disc.xml 2>/dev/null | grep -qi "Trending Now\|Currently Airing"; then
                echo "  Discover ready after ${DISC_WAIT}s"
                sleep 1
                break
              fi
              sleep 1
              DISC_WAIT=$((DISC_WAIT + 1))
            done

            # Screenshot 7: Discover landing (section rows)
            adb shell screencap -p /sdcard/discover.png || echo "::warning::Failed to capture Discover screenshot"
            adb pull /sdcard/discover.png screenshots/discover.png || echo "::warning::Failed to pull Discover screenshot"
            echo "Captured: discover.png (Discover — $AUTH_MODE)"

            # Screenshot 8: View All (default Large grid). Tap the first "View All ›".
            if tap_first_view_all; then
              BROWSE_WAIT=0
              while [ $BROWSE_WAIT -lt 15 ]; do
                adb shell uiautomator dump /sdcard/ui_browse.xml 2>/dev/null || true
                # On the browse page the row "View All" links are gone but cards remain.
                if adb shell cat /sdcard/ui_browse.xml 2>/dev/null | grep -qi "ONE PIECE\|Attack on Titan" \
                   && ! adb shell cat /sdcard/ui_browse.xml 2>/dev/null | grep -q "View All"; then
                  echo "  View All ready after ${BROWSE_WAIT}s"
                  break
                fi
                sleep 1
                BROWSE_WAIT=$((BROWSE_WAIT + 1))
              done
              sleep 1
              adb shell screencap -p /sdcard/browse.png || echo "::warning::Failed to capture View All screenshot"
              adb pull /sdcard/browse.png screenshots/browse.png || echo "::warning::Failed to pull View All screenshot"
              echo "Captured: browse.png (View All — $AUTH_MODE)"
              # Back to Discover (View All is a stacked route, so BACK is safe here).
              adb shell input keyevent KEYCODE_BACK
              sleep 1.5
            else
              echo "::warning::Could not open a View All list — skipping browse screenshot"
            fi

          else
            echo "::warning::Discover tab unreachable — skipped Discover/View All screenshots"
          fi

          # Screenshot 9: Search results. Its own tab since #43, so this deliberately sits OUTSIDE
          # the Discover guard — nested under DISCOVER_OPENED, one failed Discover tap silently
          # skipped the Search capture as well. goto_tab works from anywhere, including a pushed
          # details stack, so there is nothing to unwind first.
          if open_search_tab; then
            sleep 1
            # Tap the field by its hint to guarantee focus before typing. The page focuses it
            # on appear when empty, but a tap is a cheap belt-and-suspenders for CI.
            tap_element_by_text "Search all anime..." || true
            sleep 1
            # "no" matches five romaji stub titles (Shingeki no Kyojin, Kimi no Na wa, Yakusoku
            # no Neverland, Hagane no Renkinjutsushi, Kimetsu no Yaiba) so the results list is
            # full and shows a mix of status pills (and some off-list rows).
            adb shell input text "no"
            SEARCH_WAIT=0
            while [ $SEARCH_WAIT -lt 12 ]; do
              adb shell uiautomator dump /sdcard/ui_search.xml 2>/dev/null || true
              if adb shell cat /sdcard/ui_search.xml 2>/dev/null | grep -qi "Shingeki no Kyojin"; then
                echo "  Search results ready after ${SEARCH_WAIT}s"
                break
              fi
              sleep 1
              SEARCH_WAIT=$((SEARCH_WAIT + 1))
            done
            sleep 1
            adb shell screencap -p /sdcard/search.png || echo "::warning::Failed to capture Search screenshot"
            adb pull /sdcard/search.png screenshots/search.png || echo "::warning::Failed to pull Search screenshot"
            echo "Captured: search.png (Search — $AUTH_MODE)"
          else
            echo "::warning::Could not reach the Search tab — skipping search screenshot"
          fi

          echo ""
          echo "Auth mode: $AUTH_MODE"
          echo "Screenshots captured:"
          ls -la screenshots/

          # Dump device logcat for diagnostics. The 2MB ring buffer covers the
          # whole test run (boot → final screenshot). Filter to the app's PID
          # plus image/network/MAUI tags so the artifact is useful without us
          # having to grep through hundreds of MB.
          mkdir -p logs
          PID=$(adb shell pidof "$PACKAGE" 2>/dev/null || true)
          echo "App PID: ${PID:-<not running>}"
          adb logcat -d -v threadtime > logs/logcat-full.txt 2>&1 || echo "::warning::Failed to dump full logcat"
          if [ -n "$PID" ]; then
            adb logcat -d -v threadtime --pid="$PID" > logs/logcat-app.txt 2>&1 || echo "::warning::Failed to dump app logcat"
          fi
          # Tag-filtered slice that's likely to contain image-loading errors
          adb logcat -d -v threadtime \
            DOTNET:V mono-stdout:V mono-rt:V Mono:V \
            ImageLoader:V Glide:V Picasso:V \
            okhttp:V OkHttp:V \
            chromium:V cr_BrowserStartup:V \
            EGL_emulation:W gralloc:W BufferQueueProducer:W \
            AndroidRuntime:E System.err:E *:F \
            > logs/logcat-tags.txt 2>&1 || echo "::warning::Failed to dump tag-filtered logcat"
          echo "Logcat sizes:"
          ls -la logs/
          SCRIPT
          chmod +x /tmp/capture_screenshots.sh

      - name: Run Emulator & Capture Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -prop persist.sys.locale=en-US
          disable-animations: true
          script: /tmp/capture_screenshots.sh

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: screenshots/
          retention-days: 5
          if-no-files-found: warn

      - name: Upload Device Logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-logcat
          path: logs/
          retention-days: 5
          if-no-files-found: warn

      - name: Commit Screenshots
        id: commit-screenshots
        # Cannot push to fork PRs — GITHUB_TOKEN lacks write access to the source repo
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ ! -d "screenshots" ] || [ -z "$(find screenshots -name '*.png' -type f 2>/dev/null)" ]; then
            echo "No screenshots to commit"
            echo "has_screenshots=false" >> $GITHUB_OUTPUT
            echo "screenshots_published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_screenshots=true" >> $GITHUB_OUTPUT

          # If the PR branch has already been deleted (merged before CI finished),
          # pushing would fail with a non-fatal error. Skip the commit gracefully.
          if ! git ls-remote --exit-code --heads origin "$GITHUB_HEAD_REF" > /dev/null 2>&1; then
            echo "::warning::Branch '$GITHUB_HEAD_REF' no longer exists — PR was likely merged before CI finished. Skipping screenshot commit."
            echo "screenshots_published=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          if git diff --cached --quiet; then
            echo "Screenshots unchanged — nothing to commit"
          else
            git commit -m "CI: Update UI screenshots [skip ci]"
            git push
          fi
          echo "screenshots_published=true" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v8
        env:
          SCREENSHOT_SHA: ${{ steps.commit-screenshots.outputs.sha }}
          HAS_SCREENSHOTS: ${{ steps.commit-screenshots.outputs.has_screenshots }}
          SCREENSHOTS_PUBLISHED: ${{ steps.commit-screenshots.outputs.screenshots_published }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-ui-screenshots -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.issue.number;
            const sha = process.env.SCREENSHOT_SHA;
            const hasScreenshots = process.env.HAS_SCREENSHOTS === 'true';
            const screenshotsPublished = process.env.SCREENSHOTS_PUBLISHED === 'true';

            const screenshots = [
              { file: 'screenshots/my_anime.png', label: 'Library' },
              { file: 'screenshots/discover.png', label: 'Discover' },
              { file: 'screenshots/browse.png', label: 'View All (Browse)' },
              { file: 'screenshots/search.png', label: 'Search' },
              { file: 'screenshots/one_piece_details.png', label: 'One Piece Details' },
              { file: 'screenshots/studio_details.png', label: 'Toei Animation (Studio)' },
              { file: 'screenshots/character_details.png', label: 'Luffy (Character)' },
              { file: 'screenshots/staff_details.png', label: 'Mayumi Tanaka (Staff)' },
              { file: 'screenshots/settings.png', label: 'Settings' },
            ];

            // Build image URLs using the commit SHA for reliable, cache-proof links
            const imageMarkdowns = [];
            if (hasScreenshots && screenshotsPublished && sha) {
              for (const shot of screenshots) {
                if (!fs.existsSync(shot.file)) {
                  core.warning(`Screenshot not found: ${shot.file}`);
                  continue;
                }
                const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${sha}/${shot.file}`;
                imageMarkdowns.push({ label: shot.label, url: rawUrl });
              }
            }

            // --- Build PR comment body ---
            const authNote = '> ✅ **Authenticated UI** — screenshots rendered via compile-time CI stub services with hardcoded data. No OAuth token required.';
            const pageDesc = '';

            const bodyParts = [
              marker,
              '## 📱 UI Screenshots',
              '',
              authNote,
              '',
              `**[View Workflow Run →](${runUrl})**`,
              '',
            ];

            if (imageMarkdowns.length > 0) {
              // Embed images side-by-side in a table
              bodyParts.push(
                '| ' + imageMarkdowns.map(i => `${i.label}${pageDesc}`).join(' | ') + ' |',
                '| ' + imageMarkdowns.map(() => ':---:').join(' | ') + ' |',
                '| ' + imageMarkdowns.map(i => `![${i.label}](${i.url})`).join(' | ') + ' |',
              );
            } else if (hasScreenshots) {
              bodyParts.push(
                '⚠️ Screenshots were captured for this run, but they were not published to the PR branch.',
                '',
                '> Download the **ui-screenshots** artifact from the Artifacts section at the bottom of the workflow run page.',
              );
            } else {
              bodyParts.push(
                '⚠️ No screenshots were captured for this run.',
                '',
                '> Download the **ui-screenshots** artifact from the Artifacts section at the bottom of the workflow run page.',
              );
            }

            const body = bodyParts.join('\n');

            // --- Post or update the PR comment ---
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body,
              });
              core.info('Updated existing PR comment with screenshots');
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body,
              });
              core.info('Posted PR comment with screenshots');
            }

      - name: Generate Screenshot Summary
        if: always()
        run: |
          echo "## 📱 UI Screenshots" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "screenshots" ] && [ "$(ls -A screenshots/ 2>/dev/null)" ]; then
            echo "Screenshots captured and uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ✅ **Authenticated UI** — rendered via compile-time CI stub services with hardcoded data." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Screenshot | Page |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            for shot in \
              "my_anime.png|Library" \
              "discover.png|Discover" \
              "browse.png|View All (Browse)" \
              "search.png|Search" \
              "one_piece_details.png|One Piece Details" \
              "studio_details.png|Toei Animation (Studio)" \
              "character_details.png|Luffy (Character)" \
              "staff_details.png|Mayumi Tanaka (Staff)" \
              "settings.png|Settings"; do
              file="${shot%%|*}"
              label="${shot#*|}"
              if [ -f "screenshots/$file" ]; then
                echo "| \`$file\` | $label |" >> $GITHUB_STEP_SUMMARY
              else
                echo "::warning::Expected screenshot missing: $file"
              fi
            done
          else
            echo "⚠️ No screenshots were captured. Check the emulator step logs." >> $GITHUB_STEP_SUMMARY
          fi
